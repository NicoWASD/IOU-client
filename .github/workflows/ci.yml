name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iou-client --build-arg VITE_API_URL=http://localhost:3000/api .
      - name: nginx sirve la SPA y el fallback de rutas
        run: |
          docker run -d --name web -p 8080:80 iou-client
          sleep 2
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/grupos/123)" = "200"
